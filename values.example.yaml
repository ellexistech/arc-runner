# Example Helm values for gha-runner-scale-set.
# Copy to ~/arc-runners-values.yaml on the builder and edit placeholders.
#
# Capacity:
# - With DinD, budget ~1.5–2 Gi per runner pod (runner + privileged dind).
# - Single 8GB node: maxRunners 2–4; raise only with headroom.
# - Multi-node: maxRunners is cluster-wide. Cap a 4GB agent at one runner by
#   reserving kube/system memory on join (see scripts/join-agent.sh / SETUP §2b).
# - requests only (no limits): Burstable pods can use free host RAM.
#
# After editing: helm upgrade ellexis-runners \
#   --namespace arc-runners \
#   oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#   --version 0.14.2 \
#   -f ~/arc-runners-values.yaml
#
# Release name must match install (ellexis-runners), not "arc-runners".
githubConfigUrl: "https://github.com/YOUR_ORG"

githubConfigSecret: "github-app-secret"

minRunners: 0
maxRunners: 3

runnerScaleSetName: "ellexis-runners"

# Injects a privileged docker:dind sidecar + DOCKER_HOST so workflows can
# docker build / buildx (required for Columbus ellie-images). See SETUP.md.
containerMode:
  type: dind

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/ellexistech/arc-runner:0.3.1
        command:
          - /home/runner/run.sh
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
        volumeMounts:
          - name: ci-cache
            mountPath: /cache/ci
    volumes:
      - name: ci-cache
        hostPath:
          path: /cache/ci
          type: DirectoryOrCreate
